<p>{{errMessage()}}</p>

<table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%;">
  <thead>
    <tr style="background-color: #f2f2f2;">
      <th style="width: 50px;">IdF</th>
      <th style="width: 200px;">Fashion Subject</th>
      <th>Fashion Detail</th>
      <th style="width: 120px;">Image</th>
      <th style="width: 100px;">Thao tác</th>
    </tr>
  </thead>
  <tbody>
    @for (fashion of fashions(); track fashion._id) {
      <tr>
        <td style="text-align: center; font-weight: bold;">{{fashion.IdF}}</td>
        <td>{{fashion.fashion_subject}}</td>
        <td>{{fashion.fashion_detail}}</td>
        <td style="text-align: center;">
          <img [src]="fashion.fashion_image" width="100px" height="100px" style="object-fit: cover;">
        </td>
        <td style="text-align: center;">
          <a [routerLink]="['/fashion-detail', fashion.slug]">Xem chi tiết</a>
        </td>
      </tr>
    }
  </tbody>
</table>
